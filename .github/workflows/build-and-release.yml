name: Android Release Workflow

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: Build & Release Android App
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version Code & Name
        id: get_version
        run: |
          VERSION_CODE=$(grep -E 'versionCode\s*=\s*' app/build.gradle.kts | awk -F'=' '{print $2}' | tr -d ' ')
          
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"' app/build.gradle.kts | awk -F'"' '{print $2}')
          
          echo "VERSION_TAG=v$VERSION_CODE" >> $GITHUB_ENV
          echo "DISPLAY_NAME=$VERSION_NAME" >> $GITHUB_ENV
          
          echo "Version Code (Tag): v$VERSION_CODE"
          echo "Version Name (Display): $VERSION_NAME"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          git fetch --tags
          if git rev-parse "$VERSION_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ env.VERSION_TAG }} (versionCode $VERSION_CODE) already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ env.VERSION_TAG }} does not exist. Building now..."
          fi

      - name: Setup Java JDK
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.check_tag.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        if: steps.check_tag.outputs.exists == 'false'
        run: chmod +x gradlew

      - name: Build Release APK
        if: steps.check_tag.outputs.exists == 'false'
        run: ./gradlew assembleFossRelease --stacktrace

      - name: Sign Android Release APK
        if: steps.check_tag.outputs.exists == 'false'
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/foss/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Release v${{ env.DISPLAY_NAME }}"
          prerelease: ${{ contains(env.DISPLAY_NAME, 'alpha') || contains(env.DISPLAY_NAME, 'beta') || contains(env.DISPLAY_NAME, 'rc') }}
          body: |
            ## 🚀 New Release

            * **Version Name:** `${{ env.DISPLAY_NAME }}`
            * **Version Code:** `${{ env.VERSION_TAG }}`
            * **Status:** Signed Release APK
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}